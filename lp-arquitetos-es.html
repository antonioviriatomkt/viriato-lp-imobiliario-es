<!-- Landing da campanha paga — ARQUITETOS · ESPANHA.

     É a página para onde apontam os cinco grupos de anúncios da campanha
     espanhola. Espanha ficou com todo o orçamento a 17/08 (~4.100 pesquisas
     qualificadas a €4,26, leilão vazio confirmado duas vezes).

     Esta casca não tem conteúdo: o corpo é o assets/lp.js e tudo o que é
     castelhano vive no assets/conteudo.js, na entrada que o `data-variante`
     abaixo escolhe. Se uma frase muda, muda lá.

     Uma página para os cinco grupos — sem variante por cidade. Se algum grupo
     vier a merecer página própria será Barcelona, e só com dados.

     ⚠️ NÃO PODE RECEBER TRÁFEGO. Faltam três respostas comerciais — preço por
     peça, rondas de revisão, prazo de concurso — e faltam o endpoint do
     formulário, o número de WhatsApp, o domínio e a medição. -->
<meta name="robots" content="noindex, nofollow">
